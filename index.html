function rm(g){ed.objs=ed.objs.filter(o=>{if(o.userData.e&&o.userData.e[7]===g){scene.remove(o);return false}return true});ed.A=ed.A.filter(e=>e[7]!==g)}

function ray(e){const r=cv.getBoundingClientRect();v2.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));rc.setFromCamera(v2,cam);return rc.intersectObjects(ed.objs,true)[0]}
function calc(h){const T=TOOLS.find(x=>x[0]==ed.tool);if(!T[2])return null;let[w,hh,d]=T[2];if(ed.rot)[w,d]=[d,w];const n=h.face.normal,p=h.point;let x,y,z;
if(Math.abs(n.y)>.5){x=Math.round(p.x/10)*10;z=Math.round(p.z/10)*10;y=n.y>0?p.y+hh/2:p.y-hh/2}else{x=Math.round((p.x+n.x*w/2)/10)*10;z=Math.round((p.z+n.z*d/2)/10)*10;y=Math.round(p.y/5)*5}
return{x,y,z,w,hh,d,sy:p.y,top:n.y>.5}}
function ghostAt(e){const g=ed.ghost,h=ray(e),c=h&&calc(h);if(!c){g.visible=false;return}g.visible=true;g.position.set(c.x,c.y,c.z);g.scale.set(c.w,c.hh,c.d);g.material.color.set(ed.tool=='kill'?0xff1744:0x00e5ff)}
function clickEd(e){const h=ray(e);if(!h)return;if(ed.tool=='erase'){let o=h.object;while(o.parent&&o.parent!==scene)o=o.parent;if(o.userData.e)rm(o.userData.e[7]);return}

if(ed.tool=='spawn')ed.A.filter(a=>a[0]=='spawn').forEach(a=>rm(a[7]));add([[ed.tool,c.x,c.y,c.z,c.w,c.hh,c.d]],++ed.gid)}
function eloop(t){if(mode!='edit')return;const dt=Math.min(.05,(t-lastT)/1000);lastT=t;const f=(keys.f?1:0)-(keys.b?1:0),r=(keys.r?1:0)-(keys.l?1:0),sy=Math.sin(yaw),co=Math.cos(yaw),k=dt*dist*.8;tgt.x=clamp(tgt.x+(r*co-f*sy)*k,-300,300);tgt.z=clamp(tgt.z+(-r*sy-f*co)*k,-300,300);orbit(dt,5);raf=requestAnimationFrame(eloop)}
