async function refreshShopEmotes(){
  const map=new Map();
  try{(ls.g('emotes')||[]).forEach(e=>{if(e&&e.id)map.set(e.id,e)})}catch(e){}
  (shopEmotes||[]).forEach(e=>{if(e&&e.id)map.set(e.id,e)});
  if(typeof db!=='undefined'&&db){
    try{
      const sn=await db.collection('emotes').get();
      sn.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
    }catch(e){}
    for(const path of ['public_data/emotes','meta/emotes','ads/_emotes']){
      try{
        const sn=await db.doc(path).get();
        if(sn&&sn.exists&&sn.data()){
          const items=sn.data().items||sn.data().emotes||[];
          items.forEach(em=>{if(em&&em.id)map.set(em.id,em)});
        }
      }catch(e){}
    }
    try{
      const acc=await db.collection('accounts').get();
      acc.docs.forEach(d=>{
        const a=d.data()||{};
        (a.listedEmotes||[]).forEach(em=>{if(em&&em.id&&em.price>0)map.set(em.id,em)});
      });
    }catch(e){}
  }
  shopEmotes=[...map.values()].filter(e=>e&&e.price>0).sort((a,b)=>(b.at||0)-(a.at||0));
  try{ls.s('emotes',shopEmotes.slice(0,100))}catch(e){}
  return shopEmotes;
}

function drawFriendAvatar(canvas, av){
  // Queue 3D snapshot via ONE shared WebGL context (never creates per-friend contexts)

    const g0=canvas.getContext('2d');
    if(g0){const W=canvas.width,H=canvas.height;const grd=g0.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#b8d9ff');grd.addColorStop(1,'#eef6ff');g0.fillStyle=grd;g0.fillRect(0,0,W,H)}
    window._fav3dQ=window._fav3dQ||[];
    window._fav3dQ.push({canvas,av});
    if(!window._fav3dBusy) fav3dPump();
  }catch(e){}
}
function fav3dPump(){
  const q=window._fav3dQ||[];
  if(!q.length){window._fav3dBusy=0;return}
  window._fav3dBusy=1;
  const job=q.shift();
  try{fav3dRenderOne(job.canvas,job.av)}catch(e){console.warn('fav3d',e)}
  // yield so we don't freeze UI / stack contexts
  setTimeout(fav3dPump,0);
}
function fav3dEnsure(){
  if(window._fav3d && window._fav3d.r){
    try{const gl=window._fav3d.r.getContext();if(gl&&!gl.isContextLost())return window._fav3d}catch(e){}
    try{window._fav3d.r.dispose()}catch(e){}
    window._fav3d=null;
  }
  const off=document.createElement('canvas');
  off.width=192;off.height=240;
  const r=new THREE.WebGLRenderer({canvas:off,antialias:true,alpha:true});
  r.setClearColor(0x000000,0);
  r.setSize(192,240,false);
  r.setPixelRatio(1);
  const sc=new THREE.Scene();
  const cm=new THREE.PerspectiveCamera(30,192/240,1,500);
  cm.position.set(0,28,110);cm.lookAt(0,22,0);
  sc.add(new THREE.HemisphereLight(0xffffff,0x667788,1));
  const dl=new THREE.DirectionalLight(0xffffff,.75);dl.position.set(40,80,60);sc.add(dl);
  window._fav3d={r,sc,cm,off,ch:null};
  return window._fav3d;
}
function fav3dRenderOne(canvas, av){
  if(!canvas||!canvas.getContext)return;
  const S=fav3dEnsure();
  // clear previous character meshes
  if(S.ch){
    S.sc.remove(S.ch);
    try{S.ch.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m&&m.dispose&&m.dispose())}})}catch(e){}
    S.ch=null;
  }
  const ch=char(av||DAV,'');
  ch.rotation.y=0.35;
  S.sc.add(ch);S.ch=ch;
  S.r.render(S.sc,S.cm);
  const g=canvas.getContext('2d');
  if(!g)return;
  g.clearRect(0,0,canvas.width,canvas.height);
  // soft sky behind
  const grd=g.createLinearGradient(0,0,0,canvas.height);
  grd.addColorStop(0,'#b8d9ff');grd.addColorStop(1,'#eef6ff');
  g.fillStyle=grd;g.fillRect(0,0,canvas.width,canvas.height);
  try{g.drawImage(S.off,0,0,canvas.width,canvas.height)}catch(e){}
}

  if(db){

function makeBubbleTexture(text){
  const msg=String(text||'').slice(0,60);
  const cv=document.createElement('canvas');cv.width=512;cv.height=128;
  const g=cv.getContext('2d');
  g.clearRect(0,0,512,128);
  // bubble bg
  g.fillStyle='rgba(255,255,255,0.94)';
  g.strokeStyle='rgba(0,0,0,0.25)';
  g.lineWidth=3;
  const pad=12, x=16, y=16, w=480, h=80, r=16;
  g.beginPath();
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.lineTo(x+w*0.45,y+h);g.lineTo(x+w*0.4,y+h+14);g.lineTo(x+w*0.35,y+h);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
  g.fill();g.stroke();
  g.fillStyle='#111';g.font='bold 28px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';

  const words=msg.split(/\s+/);let line='',lines=[];
  words.forEach(w=>{const t=line?line+' '+w:w;if(g.measureText(t).width>440){if(line)lines.push(line);line=w}else line=t});
  if(line)lines.push(line);
  lines=lines.slice(0,2);
  lines.forEach((ln,i)=>g.fillText(ln,256,48+(i-(lines.length-1)/2)*30));
  const tex=new THREE.CanvasTexture(cv);tex.needsUpdate=true;return tex;
}

function updateChatBubbles(){

function playerAttack(){
  if(mode!=='play'||atkCd>0||playerHp<=0)return;
  // No weapons/zombies in this game → do nothing (no message)
  const hasCombat=((lv.Z||[]).some(z=>!z.dead)||(lv.Gary||[]).some(g=>!g.dead)||(lv.W||[]).length||hasSword||hasGun||(gpeers&&gpeers.length));
  if(!hasCombat&&!hasSword&&!hasGun)return;
  if(!weapon){say('Pick up a sword or gun first');return}
  if(weapon==='sword'){
    atkCd=.35;sfx('dash');
    const reach=30, ang=faceR;
    (lv.Z||[]).forEach(z=>{
      if(z.dead)return;
      const dx=z.x-P.x,dz=z.z-P.z,dist=Math.hypot(dx,dz);
      if(dist>reach)return;
      const dir=Math.atan2(dx,dz);let da=Math.abs(dir-ang);while(da>Math.PI)da=Math.abs(da-Math.PI*2);
      if(da<0.9||dist<14){z.hp-=28;z.hurtT=.2;if(z.hp<=0)killZombie(z)}
    });
    // Hit Gary NPCs
    (lv.Gary||[]).forEach(g=>{
      if(g.dead)return;
      const dx=g.x-P.x,dz=g.z-P.z,dist=Math.hypot(dx,dz);
      if(dist>reach)return;
      const dir=Math.atan2(dx,dz);let da=Math.abs(dir-ang);while(da>Math.PI)da=Math.abs(da-Math.PI*2);
      if(da<0.95||dist<16){hurtGary(g,28)}
    });
    // Hit other players (PvP sword)
    if(gpeers){
      for(const p of gpeers){
        const pr=p.presence;if(!pr||!pr.u||pr.u===me)continue;
        if(pr.x==null||pr.z==null)continue;
        const dx=pr.x-P.x,dz=pr.z-P.z,dist=Math.hypot(dx,dz);
        if(dist>reach)continue;
        const dir=Math.atan2(dx,dz);let da=Math.abs(dir-ang);while(da>Math.PI)da=Math.abs(da-Math.PI*2);
        if(da<0.95||dist<16){
          const dmg=25;
          say('Hit '+dname(pr.u)+' with sword!');
          try{if(groom)groom.emit('dmg',{to:pr.u,n:dmg,from:me,fn:acct.dn||me,w:'sword'})}catch(e){}
        }
      }
    }
  }else{
    atkCd=.2;sfx('jump');
    const ang=faceR;
    const sx=P.x+Math.sin(ang)*12, sy=P.y+22, sz=P.z+Math.cos(ang)*12;
    const vx=Math.sin(ang)*380, vz=Math.cos(ang)*380;

    // tell other clients so THEIR machine can detect touch on their body
    try{if(groom)groom.emit('bullet',{x:sx,y:sy,z:sz,vx:vx,vz:vz,from:me,fn:acct.dn||me})}catch(e){}
  }
}

function makeHpBarSprite(ratio,label){
  const c=document.createElement('canvas');c.width=128;c.height=28;
  const ctx=c.getContext('2d');

  ctx.fillStyle='#333';ctx.fillRect(8,14,112,10);
  ctx.fillStyle=ratio>.5?'#4caf50':ratio>.25?'#ff9800':'#f44336';
  ctx.fillRect(8,14,Math.max(0,112*ratio),10);
  ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';
  ctx.fillText(label||'',64,12);
  const tex=new THREE.CanvasTexture(c);tex.needsUpdate=true;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp.scale.set(28,7,1);sp.center.set(0.5,0);
  sp.userData.canvas=c;sp.userData.ctx=ctx;sp.userData.tex=tex;
  return sp;
}
function updateHpBarSprite(sp,ratio,label){
  if(!sp||!sp.userData||!sp.userData.ctx)return;
  const ctx=sp.userData.ctx,c=sp.userData.canvas;
  ctx.clearRect(0,0,128,28);
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,128,28);
  ctx.fillStyle='#333';ctx.fillRect(8,14,112,10);
  ctx.fillStyle=ratio>.5?'#4caf50':ratio>.25?'#ff9800':'#f44336';
  ctx.fillRect(8,14,Math.max(0,112*Math.min(1,ratio)),10);
  ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';
  ctx.fillText(label||'',64,12);
  sp.userData.tex.needsUpdate=true;
}

function applyGameFog(fogPct,fogCol){
  if(!scene)return;
  const fp=Math.max(0,Math.min(100,+(fogPct!=null?fogPct:(ed&&ed.fog!=null?ed.fog:40))));
  const skyHex=(ed&&ed.skyCol)||null;
  if(skyHex){try{const sk=new THREE.Color(skyHex);scene.background=sk;if(R3)R3.setClearColor(sk,1)}catch(e){}}
  if(fp<=0){scene.fog=null;return}
  const t=Math.pow(fp/100,0.85);
  const near=Math.max(1, Math.round(400*(1-t)+1.5*t));
  const far=Math.max(near+3, Math.round(900*(1-t)+10*t));
  const fc=fogCol||(ed&&ed.fogCol)||skyHex||'#a0b8d0';
  try{scene.fog=new THREE.Fog(new THREE.Color(fc), near, far)}catch(e){scene.fog=null}
}
function applySkyColor(hex){
  if(!scene||!hex)return;
  try{
    const sk=new THREE.Color(hex);
    scene.background=sk;
    if(R3)R3.setClearColor(sk,1);
    if(scene.fog&&ed&&ed.fog>0)applyGameFog(ed.fog,ed.fogCol||hex);
  }catch(e){}
}

    studioHist.push(snap);

function studioUndo(){

    const A=JSON.parse(prev);

    (ed.objs||[]).slice().forEach(o=>{try{scene.remove(o)}catch(e){}});

}

function chooseImport(kind){
  if(!ed||mode!=='edit')return;
  const input=E('input');input.type='file';input.style.display='none';
  input.accept=kind==='image'?'image/png,image/jpeg,image/webp,image/gif':'.obj,text/plain';

    const file=input.files&&input.files[0];input.remove();if(!file)return;
    if(kind==='image'){
      if(file.size>12*1024*1024){toast('Image too large. Maximum 12 MB.');return}
      const reader=new FileReader();
      reader.onerror=()=>toast('Could not read image file');
      reader.onload=()=>{
        const isGif=file.type==='image/gif'||/\.gif$/i.test(file.name);
        const img=new Image();img.onerror=()=>toast('That image could not be opened');
        img.onload=()=>{
          const max=1024,scale=Math.min(1,max/Math.max(img.width,img.height));
          const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
          // Keep the original GIF bytes so the animation is not flattened into one JPEG frame.
          let data;
          if(isGif){data=reader.result;if(data.length>1800000){toast('GIF is too large. Maximum 1.8 MB after encoding.');return}}
          else{
            const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
            canvas.getContext('2d').drawImage(img,0,0,w,h);
            data=canvas.toDataURL('image/jpeg',.82);
            if(data.length>1800000){toast('Image is too large after compression');return}
          }
          const worldW=60,worldH=Math.max(8,60*h/w),id=++ed.gid;
          const part=['importImage',Math.round(tgt.x/5)*5,worldH/2,Math.round(tgt.z/5)*5,worldW,worldH,1,data,0,0,0,0,id];
          const obj=mesh(part);obj.userData.e=part;ed.A.push(part);ed.objs.push(obj);ed.sel=part;ed.selG=new Set([id]);hl();selPanel();exRefresh();toast(isGif?'Animated GIF imported!':'Image imported into your world');
        };img.src=reader.result;
      };reader.readAsDataURL(file);
    }else{
      if(file.size>2*1024*1024){toast('OBJ file too large. Maximum 2 MB.');return}
      if(!/\.obj$/i.test(file.name)){toast('Please choose a .obj 3D model');return}
      const textData=await file.text();
      if(!/^\s*(v\s|#|o\s|g\s|mtllib\s|usemtl\s|vn\s|vt\s|f\s)/m.test(textData)){toast('This does not look like a valid OBJ file');return}
      if(!THREE.OBJLoader){toast('3D model loader did not load. Check your internet connection.');return}
      const id=++ed.gid,part=['import3d',Math.round(tgt.x/5)*5,20,Math.round(tgt.z/5)*5,40,40,40,textData,0,0,0,0,id];
      const obj=mesh(part);obj.userData.e=part;ed.A.push(part);ed.objs.push(obj);ed.sel=part;ed.selG=new Set([id]);hl();selPanel();exRefresh();toast('3D model imported into your world');
    }
  };
  input.click();
}

    at:Date.now(),
    parts:JSON.stringify(parts.map(e=>{

const DASHER_TIERS={
  basic:{id:'basic',name:'Basic',price:0,adLimit:4,adHours:3,monthlyBucks:0,desc:'Free plan. Up to 4 live ads, each lasts 3 hours.'},
  gary:{id:'gary',name:'Gary',price:100,adLimit:10,adHours:10,monthlyBucks:400,desc:'100💵/month. 400💵 stipend each month. Up to 10 ads, each lasts 10 hours.'},
  master:{id:'master',name:'Master',price:300,adLimit:Infinity,adHours:24,monthlyBucks:0,desc:'300💵/month. Unlimited ads, each lasts 24 hours while subscribed.'}
};
const MONTH_MS=30*24*60*60*1000;
function dasherTier(){
  refreshDasher();
  const d=acct&&acct.dasher;
  if(!d||!d.tier||d.tier==='basic')return DASHER_TIERS.basic;
  if(d.until&&Date.now()>d.until)return DASHER_TIERS.basic;
  return DASHER_TIERS[d.tier]||DASHER_TIERS.basic;
}
function refreshDasher(){
  if(!acct)return;
  acct.dasher=acct.dasher||{tier:'basic',until:0,lastPayout:0};
  const d=acct.dasher;
  if(d.tier&&d.tier!=='basic'&&d.until&&Date.now()>d.until){
    d.tier='basic';d.until=0;
    // keep lastPayout history
    try{putA()}catch(e){}
  }
}
function myLiveAdCount(){
  const map=new Map();
  try{
    (gameAds||[]).forEach(a=>{if(a&&a.id&&a.by===me&&!adExpired(a))map.set(a.id,a)});
    allGames().forEach(g=>{
      if(g.by!==me)return;
      if(g.ad&&g.ad.img){
        const a={...g.ad,at:g.ad.at||g.adAt||0,exp:g.ad.exp||g.adExp||0};
        if(!adExpired(a))map.set(a.id||('g-'+g.id),a);
      }else if(g.adImg){
        const a={id:'g-'+g.id,at:g.adAt||0,exp:g.adExp||0};
        if(!adExpired(a))map.set(a.id,a);
      }
    });
  }catch(e){}
  return map.size;
}
async function subscribeDasher(tierId){
  refreshDasher();
  const t=DASHER_TIERS[tierId];
  if(!t)return;
  if(tierId==='basic'){
    acct.dasher={tier:'basic',until:0,lastPayout:(acct.dasher&&acct.dasher.lastPayout)||0};
    await putA();toast('Switched to Basic (free)');
    if(mode==='lobby')render();
    return;
  }
  const price=t.price;
  if((acct.bucks||0)<price){toast('Need 💵 '+price+' Dash-Bucks for '+t.name);return}
  try{await addBucks(me,-price)}catch(e){}
  const now=Date.now();
  const prev=acct.dasher||{};
  acct.dasher={tier:tierId,until:now+MONTH_MS,lastPayout:prev.lastPayout||0};
  // Gary monthly stipend on subscribe / renew
  if(tierId==='gary'&&t.monthlyBucks>0){
    // grant if never paid out this period
    if(!prev.lastPayout||prev.lastPayout<now-MONTH_MS+86400000){
      try{await addBucks(me,t.monthlyBucks)}catch(e){}
      acct.dasher.lastPayout=now;
      toast(t.name+' active! +💵 '+t.monthlyBucks+' monthly stipend');
    }else{
      toast(t.name+' renewed for 30 days!');
    }
  }else{
    toast(t.name+' active for 30 days!');
  }
  await putA();
  if(mode==='lobby')render();
}
async function checkDasherPayout(){
  // Called on lobby load — grant Gary stipend each month while active
  refreshDasher();
  const d=acct&&acct.dasher;if(!d||d.tier!=='gary')return;
  if(d.until&&Date.now()>d.until)return;
  const t=DASHER_TIERS.gary;
  const now=Date.now();
  if(!d.lastPayout||now-d.lastPayout>=MONTH_MS){
    try{await addBucks(me,t.monthlyBucks)}catch(e){}
    d.lastPayout=now;
    await putA();
    toast('Gary Dasher stipend: +💵 '+t.monthlyBucks);
  }
}

const AD_TTL_MS=3*60*60*1000; // ads live for 3 hours only
function adExpired(a){
  if(!a)return true;
  const at=+(a.at||a.adAt||0)||0;
  const exp=+(a.exp||a.adExp||0)|| (at?at+AD_TTL_MS:0);
  if(!exp&&!at)return true; // no timestamp → treat as dead (stops spam leftovers)
  return Date.now()>=exp;
}
function adTimeLeft(a){
  const at=+(a.at||0)||0;
  const exp=+(a.exp||0)||(at+AD_TTL_MS);
  return Math.max(0,exp-Date.now());
}
let gameAds=[];
function adsLoad(a){

  const local=ls.g('ads')||[];
  const map=new Map();
  local.forEach(x=>{if(x&&x.id&&!adExpired(x))map.set(x.id,x)});
  remote.forEach(x=>{if(x&&x.id&&!adExpired(x))map.set(x.id,x)});
  // also pull any live ads off games already in memory
  try{allGames().forEach(g=>{
    const a=g.ad&&g.ad.img?{...g.ad,gameId:g.id,gameName:g.name,at:g.ad.at||g.adAt||0,exp:g.ad.exp||g.adExp||0}:null;
    if(a&&a.id&&!adExpired(a))map.set(a.id,a);
  })}catch(e){}
  gameAds=[...map.values()].sort((a,b)=>(b.at||0)-(a.at||0));
  // prune expired from local cache so they never come back
  try{
    const kept=gameAds.slice();
    ls.s('ads',kept);
  }catch(e){}
}

function fanArtRow(){

  wrap.style.cssText='display:flex;flex-wrap:wrap;gap:12px;margin:12px 0';

  })();

  const merty = fanArtCard({
    name:'merty',
    title:'Play Nightmere by dasarpy',
    caption:'Nightmere · by dasarpy · tap to play',
    src:window._MERTY_SRC,

function removeBaseplate(){
  if(!ed)return;
  // remove tracked base
  if(ed.base){
    try{scene.remove(ed.base)}catch(e){}
    ed.objs=(ed.objs||[]).filter(o=>o!==ed.base);
    ed.base=null;
  }
  // remove anything marked as base or large floor boxes
  if(scene){
    const kill=[];
    scene.traverse(o=>{
      if(!o||!o.isMesh)return;
      if(o.userData&&o.userData.isBase){kill.push(o);return}
      try{
        const p=o.geometry&&o.geometry.parameters;
        if(p&&p.width>=300&&p.height<=8&&p.depth>=300)kill.push(o);
      }catch(e){}
    });
    kill.forEach(o=>{
      try{scene.remove(o)}catch(e){}
      if(ed.objs)ed.objs=ed.objs.filter(x=>x!==o);
    });
  }
  // hide grid so void feels empty (grid often looks like a floor)
  if(ed.gh){ed.gh.visible=false}
  ed.base=null;
  ed.noBase=1;
  toast('Baseplate removed');
}
function addBaseplate(){
  if(!ed)return;
  if(ed.base){ed.base.visible=true;ed.noBase=0;if(ed.gh)ed.gh.visible=true;toast('Baseplate added');return}
  const gr=new THREE.Mesh(new THREE.BoxGeometry(400,4,400),M(CL.base));
  gr.position.y=-2;gr.userData.isBase=1;scene.add(gr);
  ed.objs.push(gr);ed.base=gr;ed.noBase=0;
  if(ed.gh)ed.gh.visible=true;
  toast('Baseplate added');
}

function placeTemplate(kind){
  const g=++ed.gid, cx=Math.round(tgt.x/ed.grid)*ed.grid, cz=Math.round(tgt.z/ed.grid)*ed.grid, y=0;
  const place=(arr)=>{add(arr,g)};
  if(kind==='void'){
    removeBaseplate();
  }else if(kind==='obby'){
    place([
      ['plat',cx-80,y+8,cz,50,6,50],
      ['plat',cx,y+18,cz,50,6,50],
      ['plat',cx+80,y+8,cz,50,6,50],
      ['kill',cx-40,y+14,cz,20,6,20],
      ['kill',cx+40,y+14,cz,20,6,20]
    ]);
    toast('Obby template placed (3 platforms + 2 kill bricks)');
  }else if(kind==='base'){
    addBaseplate();
  }
  ed.tool='select';
  selPanel();tb();
}

async function buyGamepass(g,pass){
  if(!g||!pass)return;

  if(hasPass(g.id,pass.id)){toast('You already own this');return}
  const price=Math.max(0,Math.floor(+pass.price||0));
  if(price<1){toast('Invalid pass');return}
  if((acct.bucks||0)<price){toast('Need 💵 '+price+' Dash-Bucks');return}
  try{await addBucks(me,-price);if(g.by&&g.by!==me)await addBucks(g.by,price)}catch(e){}
  acct.ownedPasses=acct.ownedPasses||{};
  acct.ownedPasses[g.id]=[...(acct.ownedPasses[g.id]||[]),pass.id];
