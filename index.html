const split=p=>{const i=p.indexOf('/');return[p.slice(0,i),p.slice(i+1)]};
const watch=(col,fn)=>{const ch=sb.channel('w'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:T,filter:'col=eq.'+col},fn).subscribe();return()=>sb.removeChannel(ch)};
const db={doc(path){const[c,id]=split(path),o={
async get(){const{data,error}=await sb.from(T).select('data').eq('col',c).eq('id',id).maybeSingle();if(error)throw error;return{exists:!!data,id,data:()=>data?data.data:undefined}},
async set(v){const{error}=await sb.from(T).upsert({col:c,id,data:v});if(error)throw error},
async update(v){const s=await o.get();if(!s.exists)throw new Error('not_found');await o.set({...s.data(),...v})},
async delete(){const{error}=await sb.from(T).delete().eq('col',c).eq('id',id);if(error)throw error},
onSnapshot(cb,eb){const run=()=>o.get().then(cb,eb);run();return watch(c,p=>{if((p.new&&p.new.id===id)||(p.old&&p.old.id===id))run()})}};return o},
collection(c){const o={async get(){const{data,error}=await sb.from(T).select('id,data').eq('col',c);if(error)throw error;return{docs:data.map(r=>({id:r.id,data:()=>r.data}))}},
onSnapshot(cb,eb){const run=()=>o.get().then(cb,eb);run();return watch(c,run)}};return o}};
async function room(name){const ch=sb.channel('room:'+name,{config:{presence:{key:myId},broadcast:{self:false}}});const R={},st={},peers=new Map(),cbs=[],hs={};let last=0,tm=0;
const base={by:null,kind:'viewer',guest:false};
const list=()=>[{peer:myId,isMe:true,sameTab:true,presence:{...st},...base},...[...peers].map(([id,s])=>({peer:id,isMe:false,sameTab:false,presence:s,...base}))];

const send=()=>{last=Date.now();ch.send({type:'broadcast',event:'p',payload:{id:myId,st}})};
ch.on('broadcast',{event:'p'},({payload:p})=>{if(!p||p.id===myId)return;peers.set(p.id,p.st||{});fire()});
ch.on('broadcast',{event:'m'},({payload:p})=>{if(!p||p.id===myId)return;(hs[p.topic]||[]).forEach(f=>{try{f({peer:p.id,isMe:false,sameTab:false,topic:p.topic,data:p.data,...base})}catch(e){}})});
ch.on('presence',{event:'leave'},({key})=>{if(peers.delete(key))fire()});
ch.on('presence',{event:'join'},({key})=>{if(key!==myId)send()});
await new Promise(res=>{const t=setTimeout(res,6000);ch.subscribe(s=>{if(s==='SUBSCRIBED'){clearTimeout(t);ch.track({id:myId});res()}})});

peers:list,onPeers(f){cbs.push(f);setTimeout(()=>f({peers:list()}),0);return()=>{const i=cbs.indexOf(f);if(i>=0)cbs.splice(i,1)}},
on(t,f){(hs[t]=hs[t]||[]).push(f)},emit(t,d){ch.send({type:'broadcast',event:'m',payload:{id:myId,topic:t,data:d}});return Promise.resolve()},
connected:()=>true,leave(){clearTimeout(tm);sb.removeChannel(ch)}})}

function rotateSelected(){
  const P=selParts();
  if(!P.length){toast('Select something first');return}
  // Rotate group 90° around Y around the group centre
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  P.forEach(q=>{minX=Math.min(minX,q[1]-q[4]/2);maxX=Math.max(maxX,q[1]+q[4]/2);minZ=Math.min(minZ,q[3]-q[6]/2);maxZ=Math.max(maxZ,q[3]+q[6]/2)});
  const cx=(minX+maxX)/2, cz=(minZ+maxZ)/2;
  P.forEach(q=>{
    const dx=q[1]-cx, dz=q[3]-cz;
    // 90° clockwise: (x,z) -> (z, -x)
    q[1]=cx + dz;
    q[3]=cz - dx;
    // swap width and depth
    const tmp=q[4]; q[4]=q[6]; q[6]=tmp;
    rebuild(q,1);
  });
  hl();selPanel();
  toast('Rotated 90°');
}

async function publishModel(){
  const P=selParts();
  const parts=P.length?P:ed.A;
  if(!parts.length){toast('Select some parts first (or place something)');return}
  const name=prompt('Name for this model:','My Model');
  if(!name||!name.trim())return;
  const cleanName=clean(name.trim()).slice(0,32);
  const data={
    name:cleanName,
    by:me,
    at:Date.now(),
    parts:JSON.stringify(parts.map(e=>{
      const a=e.slice(0,15).map(v=>typeof v==='number'?Math.round(v*1000)/1000:v);
      while(a.length>7&&(a[a.length-1]===0||a[a.length-1]===undefined||a[a.length-1]===null))a.pop();
      return a;
    }))
  };
  const id=crypto.randomUUID().slice(0,8);
  let onlineOk=false;
  if(db){
    try{
      await db.doc('models/'+id).set(data);
      onlineOk=true;
    }catch(e){console.warn('models publish failed',e)}
  }
  // Always keep a local copy so it never feels blocked
  const list=(ls.g('models')||[]).filter(x=>x.id!==id);
  list.unshift({id,...data});
  ls.s('models',list);
  try{modelsLoad((publicModels||[]).some(m=>m.id===id)?publicModels:[{id,...data},...(publicModels||[])])}catch(e){}
  if(onlineOk) toast('Published “‘+cleanName+’” to Public Models!');
  else toast('Saved “‘+cleanName+’” on this device. (Online share needs Supabase RLS to allow inserts on the models table.)');
  renderTbx();
}

function insertModel(m){
  let parts=[];
  try{parts=typeof m.parts==='string'?JSON.parse(m.parts):m.parts}catch(e){toast('Bad model data');return}
  if(!parts||!parts.length){toast('Empty model');return}
  const g=++ed.gid;
  // Center the model on the current camera target
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9,minY=1e9;
  parts.forEach(p=>{minX=Math.min(minX,p[1]-(p[4]||0)/2);maxX=Math.max(maxX,p[1]+(p[4]||0)/2);minZ=Math.min(minZ,p[3]-(p[6]||0)/2);maxZ=Math.max(maxZ,p[3]+(p[6]||0)/2);minY=Math.min(minY,p[2]-(p[5]||0)/2)});
  const ox=(minX+maxX)/2, oz=(minZ+maxZ)/2, oy=minY;
  const cx=Math.round(tgt.x/ed.grid)*ed.grid, cz=Math.round(tgt.z/ed.grid)*ed.grid;
  const arr=parts.map(p=>{
    const e=[...p];
    while(e.length<15)e.push(0);
    e[1]=(e[1]-ox)+cx;
    e[2]=(e[2]-oy)+0; // sit on ground-ish
    e[3]=(e[3]-oz)+cz;
    e[GI]=g;
    return e;
  });
  add(arr,g);
  ed.selG=new Set([g]);
  ed.sel=ed.A.find(q=>q[GI]===g)||null;
  hl();selPanel();
  toast('Inserted “‘+m.name+’”');
}

      ['plat',cx,y+18,cz,50,6,50],
      ['plat',cx+80,y+8,cz,50,6,50],
      ['kill',cx-40,y+14,cz,20,6,20],
      ['kill',cx+40,y+14,cz,20,6,20]
